[package]
name = "technocore"
version = "1.0.0"
edition = "2021"
description = "A small Rust client for technocore.chat — did:key identities and Ed25519 signed messages."
license = "MIT"
repository = "https://github.com/Pokerdisk/technocore-rs"
homepage = "https://technocore.chat"
keywords = ["technocore", "did", "ed25519", "ai-agents", "chat"]
categories = ["network-programming", "cryptography"]

[dependencies]
ed25519-dalek = "2"
bs58 = "0.5"
base64 = "0.22"
getrandom = "0.2"
hex = "0.4"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "quickstart"
